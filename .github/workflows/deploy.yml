name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite disparar o deploy manualmente na aba Actions.
  # Sem isto, mudar "Build and deployment" para GitHub Actions nas Settings
  # não publica nada até que exista um novo push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions/deploy-pages@v4+ lê o artifact pela API de Artifacts.
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 22 saiu de suporte em out/2025; 24 é o Active LTS.
          node-version: 24
          cache: npm

      # Falha cedo e com mensagem clara se o Pages não estiver habilitado
      # para este repositório (ex.: repo privado em plano sem Pages).
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Confere fonte × derivado da matriz, e que nada publica sem sidebar.
      - name: Validate
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
